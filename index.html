<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="version" content="1.0.0">
    <meta name="app" content="CheckVerify">
    <title>CheckVerify - Verification Links</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--p:#059669;--pd:#047857;--s:#10b981;--w:#f59e0b;--d:#0f172a;--g:#64748b;--gl:#e2e8f0;--lt:#f8fafc;--w2:#fff;--gr:linear-gradient(135deg,#059669,#10b981)}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--lt);color:var(--d);line-height:1.5;font-size:14px}
        .container{max-width:900px;margin:0 auto;padding:20px}
        
        .header{background:var(--w2);padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .logo{font-size:1.5rem;font-weight:800;background:var(--gr);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .tagline{color:var(--g);font-size:14px;margin-top:4px}
        
        .card{background:var(--w2);padding:20px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        
        input,textarea,select{width:100%;padding:12px;border:2px solid var(--gl);border-radius:8px;font-size:14px;margin-bottom:12px}
        input:focus,textarea:focus{outline:none;border-color:var(--p)}
        
        .btn{padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;border:none;font-size:13px;display:inline-flex;align-items:center;gap:6px}
        .btn-primary{background:var(--gr);color:var(--w2)}
        .btn-secondary{background:var(--gl);color:var(--d)}
        .btn-success{background:var(--s);color:var(--w2)}
        
        .link-card{background:var(--lt);padding:16px;border-radius:8px;margin:8px 0;border-left:4px solid var(--s)}
        .link-url{font-family:monospace;font-size:12px;word-break:break-all;background:#fff;padding:8px;border-radius:4px;margin:8px 0}
        
        .tabs{display:flex;gap:4px;margin-bottom:16px}
        .tab{padding:10px 16px;background:var(--gl);border:none;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px}
        .tab.active{background:var(--p);color:var(--w2)}
        
        .hidden{display:none}
        .badge{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--gl)}
        .valid{color:var(--s)}
        .expired{color:#ef4444}
    </style>
</head>
<body>
    <div class="container">
<div class="header">
            <div class="logo">🔗 CheckVerify</div>
            <div class="tagline">Verification Links - Generate time-limited verification URLs for credentials</div>
            <div style="margin-top:12px;display:flex;gap:8px">
                <a href="https://buymeacoffee.com/nrupalakolt" target="_blank" class="btn btn-secondary" style="padding:6px 12px;font-size:12px;text-decoration:none;display:flex;align-items:center;gap:4px">☕ Support</a>
                <span class="text-muted" style="font-size:11px">🇨🇦 Proudly made in Canada</span>
            </div>
        </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('create')">➕ Create</button>
            <button class="tab" onclick="showTab('verify')">✓ Verify</button>
            <button class="tab" onclick="showTab('links')">🔗 Links</button>
        </div>
        
        <!-- CREATE -->
        <div id="createTab">
            <div class="card">
                <h3>➕ Create Verification Link</h3>
                <select id="linkType">
                    <option value="credential">⛓️ Credential</option>
                    <option value="certificate">📜 Certificate</option>
                    <option value="profile">👤 Profile</option>
                    <option value="custom">✏️ Custom</option>
                </select>
                <input type="text" id="linkName" placeholder="Link Name (e.g., AWS Solutions Architect)">
                <textarea id="linkData" rows="4" placeholder="Credential data (JSON or text)"></textarea>
                <select id="linkExpiry">
                    <option value="1">1 Hour</option>
                    <option value="24">24 Hours</option>
                    <option value="168">7 Days</option>
                    <option value="720">30 Days</option>
                    <option value="8760">1 Year</option>
                </select>
                <div style="display:flex;gap:8px">
                    <button class="btn btn-primary" onclick="createLink()">🔗 Generate Link</button>
                    <button class="btn btn-secondary" onclick="copyLink()">📋 Copy</button>
                </div>
            </div>
            <div class="card">
                <h3>🔗 Generated Link</h3>
                <div class="link-url" id="generatedLink">Link will appear here...</div>
                <button class="btn btn-secondary" onclick="testLink()">🧪 Test Link</button>
            </div>
        </div>
        
        <!-- VERIFY -->
        <div id="verifyTab" class="hidden">
            <div class="card">
                <h3>✓ Verify Link</h3>
                <textarea id="verifyInput" rows="4" placeholder="Paste verification token or URL..."></textarea>
                <button class="btn btn-primary" onclick="verifyLink()">✓ Verify</button>
            </div>
            <div class="card">
                <h3>📊 Verification Result</h3>
                <div id="verifyResult">Enter token to verify...</div>
            </div>
        </div>
        
        <!-- LINKS -->
        <div id="linksTab" class="hidden">
            <div class="card">
                <h3>🔗 My Links</h3>
                <div style="display:flex;gap:12px;margin-bottom:16px">
                    <div class="stat"><div class="stat-value" id="linkCount">0</div><div class="stat-label">Links</div></div>
                    <div class="stat"><div class="stat-value" id="validCount">0</div><div class="stat-label">Valid</div></div>
                </div>
                <div id="linkList"></div>
                <button class="btn btn-secondary" style="margin-top:12px" onclick="exportLinks()">📤 Export</button>
            </div>
        </div>
    </div>

    <script>
        // === CHECKVERIFY - Verification Links ===
        
        let links = JSON.parse(localStorage.getItem('checkverify_links') || '[]');
        renderLinks();
        
        function saveLinks() {
            localStorage.setItem('checkverify_links', JSON.stringify(links));
        }
        
        // Generate verification token
        function genToken(data, expiry) {
            const payload = {
                data: data,
                created: Date.now(),
                expiry: Date.now() + (expiry * 3600000),
                nonce: Math.random().toString(36).substring(2)
            };
            return btoa(JSON.stringify(payload));
        }
        
        // Parse token
        function parseToken(token) {
            try {
                return JSON.parse(atob(token));
            } catch(e) {
                return null;
            }
        }
        
        // Create link
        function createLink() {
            const linkType = document.getElementById('linkType').value;
            const linkName = document.getElementById('linkName').value.trim();
            const linkData = document.getElementById('linkData').value.trim();
            const expiryHours = parseInt(document.getElementById('linkExpiry').value);
            
            if(!linkName || !linkData) {
                alert('Name and data required');
                return;
            }
            
            const token = genToken({type: linkType, name: linkName, payload: linkData}, expiryHours);
            const url = `https://checkinfo.me/verify?t=${token}`;
            
            document.getElementById('generatedLink').textContent = url;
            
            links.unshift({
                name: linkName,
                type: linkType,
                token: token,
                url: url,
                created: Date.now(),
                expiry: Date.now() + (expiryHours * 3600000)
            });
            
            if(links.length > 100) links.pop();
            saveLinks();
            renderLinks();
            
            alert('Link generated!');
        }
        
        // Copy link
        function copyLink() {
            const url = document.getElementById('generatedLink').textContent;
            if(url === 'Link will appear here...') {
                alert('Generate link first');
                return;
            }
            navigator.clipboard.writeText(url);
            alert('Copied!');
        }
        
        // Test link
        function testLink() {
            const token = document.getElementById('generatedLink').textContent.split('t=')[1];
            if(!token || token === 'Link will appear here...') return;
            
            const payload = parseToken(token);
            if(payload) {
                alert('Link is valid! Data: ' + JSON.stringify(payload.data));
            }
        }
        
        // Verify link
        function verifyLink() {
            const input = document.getElementById('verifyInput').value.trim();
            if(!input) {
                alert('Enter token');
                return;
            }
            
            let token = input;
            if(input.includes('t=')) token = input.split('t=')[1];
            
            const payload = parseToken(token);
            if(!payload) {
                document.getElementById('verifyResult').innerHTML = '<span class="expired">❌ Invalid token</span>';
                return;
            }
            
            const now = Date.now();
            const valid = now < payload.expiry;
            const remaining = Math.round((payload.expiry - now) / 3600000);
            
            document.getElementById('verifyResult').innerHTML = `
                <div class="${valid ? 'valid' : 'expired'}">
                    ${valid ? '✅' : '❌'} Status: ${valid ? 'VALID' : 'EXPIRED'}
                </div>
                <div style="margin-top:12px">
                    <div><strong>Type:</strong> ${payload.data?.type}</div>
                    <div><strong>Name:</strong> ${payload.data?.name}</div>
                    <div><strong>Created:</strong> ${new Date(payload.created).toLocaleString()}</div>
                    <div><strong>Expires:</strong> ${new Date(payload.expiry).toLocaleString()}</div>
                    <div><strong>Time Remaining:</strong> ${valid ? remaining + ' hours' : 'Expired'}</div>
                    <div><strong>Data:</strong> <pre style="font-size:11px">${JSON.stringify(payload.data?.payload)}</pre></div>
                </div>
            `;
        }
        
        // Render links
        function renderLinks() {
            const now = Date.now();
            const valid = links.filter(l => l.expiry > now).length;
            
            document.getElementById('linkCount').textContent = links.length;
            document.getElementById('validCount').textContent = valid;
            
            let html = '';
            links.forEach((l,i) => {
                const isValid = l.expiry > now;
                html += `
                <div class="link-card">
                    <div style="display:flex;justify-content:space-between">
                        <span class="badge">${l.type}</span>
                        <span class="${isValid ? 'valid' : 'expired'}">${isValid ? '✓ Valid' : '✗ Expired'}</span>
                    </div>
                    <div style="font-weight:600;margin:8px 0">${l.name}</div>
                    <div style="font-size:11px;color:var(--g)">Expires: ${new Date(l.expiry).toLocaleString()}</div>
                    <button class="btn btn-secondary" style="margin-top:8px;padding:4px 8px;font-size:11px" onclick="useLink(${i})">Use</button>
                </div>`;
            });
            document.getElementById('linkList').innerHTML = html || 'No links yet';
        }
        
        // Use link
        function useLink(index) {
            const link = links[index];
            document.getElementById('linkName').value = link.name;
            document.getElementById('linkData').value = JSON.stringify(link.type);
            document.getElementById('generatedLink').textContent = link.url;
            showTab('create');
        }
        
        // Export links
        function exportLinks() {
            const data = JSON.stringify(links, null, 2);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'checkverify-links.json';
            a.click();
        }
        
        function showTab(tab) {
            document.querySelectorAll('[id$="Tab"]').forEach(t => t.classList.add('hidden'));
            document.getElementById(tab+'Tab').classList.remove('hidden');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
